<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <meta name="ngrok-skip-browser-warning" content="true">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:         #1a1208;
            --bg2:        #241a0e;
            --bg3:        #2e2010;
            --border:     #4a3520;
            --text:       #e8d5b0;
            --text-dim:   #a08060;
            --gold:       #c9a84c;
            --gold-dim:   #8b6914;
            --sealing:    #7a3022;
            --sealing-lt: #9b4a35;
            --green:      #4a7a50;
            --shadow:     rgba(0,0,0,0.5);
        }
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 40px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(201,168,76,0.02) 28px, rgba(201,168,76,0.02) 29px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 24px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .back-btn {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 50%; width: 36px; height: 36px;
            font-size: 18px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--shadow); font-family: serif;
        }
        .back-btn:active { background: var(--bg3); }
        .page-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); }

        .avatar-section {
            display: flex; align-items: center; gap: 16px;
            padding: 16px; background: var(--bg2);
            border-radius: 8px; border: 1px solid var(--border);
            box-shadow: 0 3px 12px var(--shadow);
            margin-bottom: 14px; position: relative; overflow: hidden;
        }
        .avatar-section::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(180deg, var(--gold), var(--sealing));
        }
        .avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, var(--sealing), #1a0a05);
            border: 2px solid var(--gold-dim);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 22px; font-weight: 700; color: var(--gold);
            flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(201,168,76,0.1), 0 0 20px rgba(201,168,76,0.1);
        }
        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;
            color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-handle { font-size: 13px; font-style: italic; color: var(--text-dim); margin-top: 2px; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 4px;
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600;
            letter-spacing: 0.8px; margin-top: 8px; border: 1px solid;
        }
        .status-0 { background: rgba(74,53,32,0.4);  color: var(--text-dim); border-color: var(--border); }
        .status-1 { background: rgba(139,105,20,0.2); color: var(--gold-dim); border-color: var(--gold-dim); }
        .status-2 { background: rgba(74,122,80,0.2);  color: #7acc84; border-color: var(--green); }
        .status-3 { background: rgba(201,168,76,0.15);color: var(--gold); border-color: var(--gold); }

        .section-title {
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 10px; margin-top: 18px;
        }

        .points-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 14px;
        }
        .points-label {
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-dim);
        }
        .points-value {
            font-family: 'Cinzel', serif; font-size: 34px; font-weight: 700;
            color: var(--gold); letter-spacing: -1px; margin-top: 4px;
            text-shadow: 0 0 20px rgba(201,168,76,0.2);
        }
        .points-next { text-align: right; }
        .points-next-label { font-size: 11px; font-style: italic; color: var(--text-dim); }
        .points-next-value { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; color: var(--gold-dim); margin-top: 3px; }
        .progress-wrap { background: rgba(255,255,255,0.06); border-radius: 4px; height: 6px; overflow: hidden; }
        .progress-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, var(--gold-dim), var(--gold));
            transition: width 1s cubic-bezier(.4,0,.2,1); width: 0%;
        }
        .progress-labels {
            display: flex; justify-content: space-between;
            margin-top: 5px; font-size: 11px; font-style: italic; color: var(--text-dim);
        }

        /* ══════════════════════════════════════
           УНИКАЛЬНЫЕ АНИМАЦИИ ДЛЯ КАЖДОГО БЛОКА
           ══════════════════════════════════════ */

        /* Аватар — покачивается как маятник, 1-3px */
        @keyframes floatAvatar {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            20%      { transform: translate(1px,-2px) rotate(0.3deg); }
            40%      { transform: translate(-2px,-1px) rotate(-0.2deg); }
            60%      { transform: translate(2px,-3px) rotate(0.4deg); }
            80%      { transform: translate(-1px,-1px) rotate(-0.1deg); }
        }
        .avatar-section {
            display: flex; align-items: center; gap: 16px;
            padding: 16px; background: var(--bg2);
            border-radius: 8px; border: 1px solid var(--border);
            box-shadow: 0 3px 12px var(--shadow);
            margin-bottom: 14px; position: relative; overflow: hidden;
            animation: floatAvatar 7s ease-in-out infinite;
            transition: transform .1s, box-shadow .1s;
        }
        .avatar-section:active { transform: scale(0.97) !important; box-shadow: 0 1px 4px var(--shadow) !important; }

        /* Репутация — медленно дышит вверх-вниз, 4px + золотое свечение */
        @keyframes floatPoints {
            0%,100% { transform: translateY(0px); }
            50%      { transform: translateY(-4px); }
        }
        @keyframes goldGlow {
            0%,100% {
                box-shadow: 0 2px 10px var(--shadow),
                            0 0 12px rgba(201,168,76,0.25),
                            0 0 24px rgba(201,168,76,0.12),
                            0 0 0 1px rgba(201,168,76,0.2);
            }
            50% {
                box-shadow: 0 6px 20px var(--shadow),
                            0 0 25px rgba(201,168,76,0.55),
                            0 0 50px rgba(201,168,76,0.25),
                            0 0 0 1px rgba(201,168,76,0.5);
            }
        }
        .points-card {
            background: var(--bg2); border-radius: 8px; padding: 16px;
            border: 1px solid var(--gold-dim);
            animation: floatPoints 5s ease-in-out infinite, goldGlow 2.5s ease-in-out infinite;
            transition: transform .1s;
        }
        .points-card:active { transform: scale(0.97) translateY(2px) !important; }

        /* Статистика — каждая карточка своя траектория */
        @keyframes floatStat1 {
            0%,100% { transform: translate(0,0); }
            30%      { transform: translate(2px,-3px); }
            70%      { transform: translate(-1px,-2px); }
        }
        @keyframes floatStat2 {
            0%,100% { transform: translate(0,0); }
            25%      { transform: translate(-2px,-4px); }
            60%      { transform: translate(1px,-1px); }
            85%      { transform: translate(-1px,-3px); }
        }
        @keyframes floatStat3 {
            0%,100% { transform: translate(0,0); }
            40%      { transform: translate(3px,-2px); }
            75%      { transform: translate(-2px,-4px); }
        }
        .stat-card {
            background: var(--bg2); border-radius: 8px; padding: 13px 10px;
            border: 1px solid var(--border); box-shadow: 0 2px 8px var(--shadow); text-align: center;
            transition: transform .1s, box-shadow .1s;
        }
        .stat-card:active { transform: scale(0.93) !important; box-shadow: 0 1px 3px var(--shadow) !important; }
        .stat-card:nth-child(1) { animation: floatStat1 6s ease-in-out infinite; }
        .stat-card:nth-child(2) { animation: floatStat2 8s ease-in-out infinite; animation-delay: -2s; }
        .stat-card:nth-child(3) { animation: floatStat3 7s ease-in-out infinite; animation-delay: -4s; }

        .stat-icon { font-size: 18px; margin-bottom: 5px; }
        .stat-num { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 700; color: var(--text); }
        .stat-num.green  { color: #7acc84; }
        .stat-num.yellow { color: var(--gold); }
        .stat-label { font-size: 11px; font-style: italic; color: var(--text-dim); margin-top: 2px; }

        /* Роли — левая уходит влево-вверх, правая вправо-вниз */
        @keyframes floatRoleLeft {
            0%,100% { transform: translate(0,0); }
            33%      { transform: translate(-3px,-3px); }
            66%      { transform: translate(1px,-1px); }
        }
        @keyframes floatRoleRight {
            0%,100% { transform: translate(0,0); }
            33%      { transform: translate(2px,-4px); }
            66%      { transform: translate(-2px,-2px); }
        }
        .roles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .role-card {
            background: var(--bg2); border-radius: 8px; padding: 14px;
            border: 1px solid var(--border); box-shadow: 0 2px 8px var(--shadow);
            transition: transform .1s, box-shadow .1s;
        }
        .role-card:active { transform: scale(0.95) !important; box-shadow: 0 1px 3px var(--shadow) !important; }
        .role-card:nth-child(1) { animation: floatRoleLeft  9s ease-in-out infinite; }
        .role-card:nth-child(2) { animation: floatRoleRight 7s ease-in-out infinite; animation-delay: -3s; }
        .role-title { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px; color: var(--gold-dim); margin-bottom: 6px; }
        .role-pts { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--gold); }
        .role-count { font-size: 12px; font-style: italic; color: var(--text-dim); margin-top: 3px; }

        .history-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab {
            padding: 6px 14px; border-radius: 4px;
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; border: 1px solid var(--border);
            background: transparent; color: var(--text-dim); transition: all .2s;
        }
        .tab.active { background: var(--sealing); color: var(--text); border-color: var(--sealing); }

        /* История сделок — каждая карточка плавает по-своему через JS */
        @keyframes floatDeal1 { 0%,100%{transform:translate(0,0)} 40%{transform:translate(2px,-2px)} 80%{transform:translate(-1px,-1px)} }
        @keyframes floatDeal2 { 0%,100%{transform:translate(0,0)} 30%{transform:translate(-2px,-3px)} 70%{transform:translate(1px,-1px)} }
        @keyframes floatDeal3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(3px,-2px)} }
        @keyframes floatDeal4 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-1px,-3px)} 75%{transform:translate(2px,-1px)} }
        @keyframes floatDeal5 { 0%,100%{transform:translate(0,0)} 35%{transform:translate(1px,-4px)} 65%{transform:translate(-2px,-1px)} }
        .deal-anim-1 { animation: floatDeal1 6s  ease-in-out infinite; }
        .deal-anim-2 { animation: floatDeal2 8s  ease-in-out infinite; animation-delay:-1s; }
        .deal-anim-3 { animation: floatDeal3 7s  ease-in-out infinite; animation-delay:-3s; }
        .deal-anim-4 { animation: floatDeal4 9s  ease-in-out infinite; animation-delay:-2s; }
        .deal-anim-5 { animation: floatDeal5 5s  ease-in-out infinite; animation-delay:-4s; }

        .deal-item {
            background: var(--bg2); border-radius: 6px; padding: 13px 14px;
            margin-bottom: 10px; cursor: pointer;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px var(--shadow);
            display: flex; align-items: center; gap: 12px;
            transition: all .15s; position: relative; overflow: hidden;
        }
        .deal-item::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        }
        .deal-item.completed::before { background: var(--green); }
        .deal-item.cancelled::before { background: var(--sealing); }
        .deal-item.active::before    { background: var(--gold-dim); }
        .deal-item.pending::before   { background: var(--gold); }
        .deal-item.dispute::before   { background: var(--sealing-lt); }
        .deal-item:active { opacity: 0.7; transform: translateY(1px); }

        .deal-icon {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border);
        }
        .deal-body { flex: 1; min-width: 0; }
        .deal-desc { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .deal-meta { font-size: 12px; font-style: italic; color: var(--text-dim); margin-top: 2px; }
        .deal-right { text-align: right; flex-shrink: 0; }
        .deal-amount { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700; }
        .deal-amount.income  { color: #7acc84; }
        .deal-amount.outcome { color: var(--sealing-lt); }
        .deal-amount.neutral { color: var(--text-dim); }
        .deal-pts { font-size: 11px; font-style: italic; color: var(--gold-dim); margin-top: 2px; }

        .empty-state { text-align: center; padding: 40px 0; color: var(--text-dim); font-style: italic; font-size: 15px; }

        .skel {
            background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite; border-radius: 4px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .fade-in { animation: fadeUp .4s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s} .d4{animation-delay:.2s} .d5{animation-delay:.25s}
    </style>
</head>
<body>

<div class="header fade-in">
    <button class="back-btn" onclick="window.location.href='index.html'">←</button>
    <span class="page-title">Личная книга</span>
</div>

<div class="avatar-section fade-in d1">
    <div class="avatar" id="avatar">?</div>
    <div class="user-info">
        <div class="user-name" id="user-name">Загрузка…</div>
        <div class="user-handle" id="user-handle"></div>
        <div id="status-pill"></div>
    </div>
</div>

<div class="section-title fade-in d2">Очки доверия</div>
<div class="points-card fade-in d2" onclick="window.location.href='reputation.html'" style="cursor:pointer">
    <div class="points-row">
        <div>
            <div class="points-label">Репутация</div>
            <div class="points-value" id="pts-value">—</div>
        </div>
        <div class="points-next">
            <div class="points-next-label">до следующего звания</div>
            <div class="points-next-value" id="pts-next">—</div>
        </div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="pts-bar"></div></div>
    <div class="progress-labels"><span id="bar-left">0</span><span id="bar-right">—</span></div>
    <div style="text-align:right;margin-top:8px;font-size:11px;font-style:italic;color:var(--gold-dim)">подробнее →</div>
</div>

<div class="section-title fade-in d3">Записи</div>
<div class="stats-grid fade-in d3">
    <div class="stat-card">
        <div class="stat-icon">📜</div>
        <div class="stat-num green" id="cnt-completed">—</div>
        <div class="stat-label">завершено</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">⚔️</div>
        <div class="stat-num yellow" id="cnt-dispute">—</div>
        <div class="stat-label">споров</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">🪙</div>
        <div class="stat-num" id="cnt-volume" style="font-size:15px">—</div>
        <div class="stat-label">оборот</div>
    </div>
</div>

<div class="section-title fade-in d4">Звания</div>
<div class="roles-grid fade-in d4">
    <div class="role-card">
        <div class="role-title">📦 КАК ПРОДАВЕЦ</div>
        <div class="role-pts" id="pts-seller">—</div>
        <div class="role-count" id="cnt-seller">— сделок</div>
    </div>
    <div class="role-card">
        <div class="role-title">🛒 КАК ПОКУПАТЕЛЬ</div>
        <div class="role-pts" id="pts-buyer">—</div>
        <div class="role-count" id="cnt-buyer">— сделок</div>
    </div>
</div>

<div class="section-title fade-in d5">История сделок</div>
<div class="history-tabs fade-in d5">
    <button class="tab active" onclick="filterDeals('all', this)">Все</button>
    <button class="tab" onclick="filterDeals('completed', this)">Завершённые</button>
    <button class="tab" onclick="filterDeals('active', this)">Активные</button>
</div>
<div id="history-list" class="fade-in d5"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
const BACKEND = 'https://garant-backend-production.up.railway.app';
const user = tg.initDataUnsafe?.user || {};
const currentUserId = user.id || 0;
let allDeals = [];

const STATUSES = [
    { min: 0,    name: 'Новичок',     emoji: '🆕', cls: 'status-0' },
    { min: 100,  name: 'Проверенный', emoji: '📜', cls: 'status-1' },
    { min: 500,  name: 'Надёжный',    emoji: '🛡️', cls: 'status-2' },
    { min: 1500, name: 'Гарант',      emoji: '⭐', cls: 'status-3' },
];
const LEVELS = [0, 100, 500, 1500];

function getStatus(pts) {
    for (let i = STATUSES.length - 1; i >= 0; i--)
        if (pts >= STATUSES[i].min) return STATUSES[i];
    return STATUSES[0];
}
function getProgress(pts) {
    const c = Math.max(0, pts);
    for (let i = 0; i < LEVELS.length - 1; i++) {
        if (c < LEVELS[i+1]) return {
            pct: Math.round((c - LEVELS[i]) / (LEVELS[i+1] - LEVELS[i]) * 100),
            left: LEVELS[i], right: LEVELS[i+1], need: LEVELS[i+1] - c
        };
    }
    return { pct: 100, left: 1500, right: '∞', need: 0 };
}
function getCommission(amount) {
    if (amount <= 10000) return 0.01;
    if (amount <= 25000) return 0.02;
    if (amount <= 50000) return 0.03;
    if (amount <= 100000) return 0.04;
    return 0.05;
}

function renderProfile(deals) {
    const name = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Гость';
    const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    document.getElementById('avatar').textContent = initials;
    document.getElementById('user-name').textContent = name;
    if (user.username) document.getElementById('user-handle').textContent = '@' + user.username;

    const completed = deals.filter(d => d.status === 'completed');
    const disputes  = deals.filter(d => d.status === 'dispute');
    const asSeller  = completed.filter(d => d.seller_id == currentUserId);
    const asBuyer   = completed.filter(d => d.buyer_id  == currentUserId);
    const sellerPts = asSeller.reduce((s, d) => s + Math.floor(parseFloat(d.amount) / 100), 0);
    const buyerPts  = asBuyer.reduce((s, d)  => s + Math.floor(parseFloat(d.amount) / 100), 0);
    const totalPts  = sellerPts + buyerPts;
    const volume    = completed.reduce((s, d) => s + parseFloat(d.amount), 0);

    const status = getStatus(totalPts);
    const prog   = getProgress(totalPts);

    document.getElementById('status-pill').innerHTML =
        `<span class="status-pill ${status.cls}">${status.emoji} ${status.name}</span>`;
    document.getElementById('pts-value').textContent = totalPts.toLocaleString('ru');
    document.getElementById('pts-next').textContent  = prog.need > 0 ? `ещё ${prog.need.toLocaleString('ru')} очков` : 'высший статус';
    document.getElementById('bar-left').textContent  = prog.left.toLocaleString('ru');
    document.getElementById('bar-right').textContent = typeof prog.right === 'number' ? prog.right.toLocaleString('ru') : prog.right;
    requestAnimationFrame(() => setTimeout(() => { document.getElementById('pts-bar').style.width = prog.pct + '%'; }, 150));
    document.getElementById('cnt-completed').textContent = completed.length;
    document.getElementById('cnt-dispute').textContent   = disputes.length;
    document.getElementById('cnt-volume').textContent    = volume >= 1000 ? (volume/1000).toFixed(1).replace('.0','') + 'к ₽' : volume.toLocaleString('ru') + ' ₽';
    document.getElementById('pts-seller').textContent = sellerPts.toLocaleString('ru');
    document.getElementById('cnt-seller').textContent = asSeller.length + ' сделок';
    document.getElementById('pts-buyer').textContent  = buyerPts.toLocaleString('ru');
    document.getElementById('cnt-buyer').textContent  = asBuyer.length + ' сделок';
}

const DEAL_META = {
    completed: { emoji: '📜', cls: 'completed', label: 'Завершена' },
    cancelled:  { emoji: '❌', cls: 'cancelled', label: 'Отменена'  },
    active:     { emoji: '📋', cls: 'active',    label: 'Активна'   },
    pending:    { emoji: '🕯', cls: 'pending',   label: 'Ожидает'   },
    dispute:    { emoji: '⚔️', cls: 'dispute',   label: 'Спор'      },
};

function dealCard(deal, idx) {
    const meta = DEAL_META[deal.status] || DEAL_META.pending;
    const amount = parseFloat(deal.amount);
    const isSeller = deal.seller_id == currentUserId;
    const net = isSeller ? amount - Math.round(amount * getCommission(amount)) : amount;
    let amountClass = 'neutral', amountSign = '';
    if (deal.status === 'completed') { amountClass = isSeller ? 'income' : 'outcome'; amountSign = isSeller ? '+' : '−'; }
    const pts = deal.status === 'completed' ? '+' + Math.floor(amount / 100) + ' очков' : '';
    const dateStr = deal.created_at ? new Date(deal.created_at).toLocaleDateString('ru', { day: 'numeric', month: 'short' }) : '';
    const animCls = 'deal-anim-' + ((idx % 5) + 1);
    return `
    <div class="deal-item ${meta.cls} ${animCls}" onclick="openDeal('${deal.id}')">
        <div class="deal-icon">${meta.emoji}</div>
        <div class="deal-body">
            <div class="deal-desc">${escHtml(deal.description)}</div>
            <div class="deal-meta">${meta.label} · ${isSeller ? 'Продавец' : 'Покупатель'}${dateStr ? ' · ' + dateStr : ''}</div>
        </div>
        <div class="deal-right">
            <div class="deal-amount ${amountClass}">${amountSign}${net.toLocaleString('ru')} ₽</div>
            ${pts ? `<div class="deal-pts">${pts}</div>` : ''}
        </div>
    </div>`;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let currentFilter = 'all';
function filterDeals(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderHistory();
}
function renderHistory() {
    const list = document.getElementById('history-list');
    let filtered = allDeals;
    if (currentFilter === 'completed') filtered = allDeals.filter(d => d.status === 'completed');
    else if (currentFilter === 'active') filtered = allDeals.filter(d => ['active','pending','dispute'].includes(d.status));
    if (!filtered.length) { list.innerHTML = `<div class="empty-state">Записей в книге нет</div>`; return; }
    list.innerHTML = filtered.map((deal, i) => dealCard(deal, i)).join('');
}
function openDeal(id) { window.location.href = `deal.html?id=${id}`; }

async function load() {
    document.getElementById('history-list').innerHTML = `
        <div class="deal-item pending">
            <div class="deal-icon skel" style="width:36px;height:36px;border-radius:50%"></div>
            <div class="deal-body">
                <div class="skel" style="height:14px;width:65%;margin-bottom:8px"></div>
                <div class="skel" style="height:11px;width:40%"></div>
            </div>
        </div>`.repeat(3);
    try {
        if (!currentUserId) throw new Error('no user');
        const res  = await fetch(`${BACKEND}/users/${currentUserId}/deals`);
        const data = await res.json();
        allDeals = data.success ? data.deals : [];
    } catch(e) { allDeals = []; }
    renderProfile(allDeals);
    renderHistory();
}
load();
</script>
