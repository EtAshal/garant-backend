<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гарант</title>
    <meta name="ngrok-skip-browser-warning" content="true">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 24px 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header p {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #2AABEE;
            color: white;
        }
        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
        }
        .deals-list {
            margin-top: 24px;
        }
        .deals-list h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            opacity: 0.4;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔒 Гарант</h1>
        <p>Безопасные сделки между людьми</p>
    </div>

    <button class="btn btn-primary" onclick="createDeal()">
        + Создать сделку
    </button>
    <button class="btn btn-secondary" onclick="showMyDeals()">
        Мои сделки
    </button>

    <div class="deals-list">
        <h2>Активные сделки</h2>
        <div class="empty-state" id="empty-state">
            У вас пока нет активных сделок
        </div>
        <div id="deals-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function createDeal() {
            window.location.href = 'create.html';
        }

        function showMyDeals() {
            window.location.href = 'deals.html';
        }
    </script>
</body>
</html>
