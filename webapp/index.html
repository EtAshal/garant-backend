<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гарант</title>
    <meta name="ngrok-skip-browser-warning" content="true">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
 
        :root {
            --parchment:  #f2e8d5;
            --paper:      #e8d5b0;
            --paper-dark: #d4b896;
            --cappuccino: #c4a882;
            --latte:      #b8956a;
            --brown:      #8b6914;
            --ink:        #3d2b1f;
            --ink-light:  #6b4c35;
            --sealing:    #7a3022;
            --sealing-light: #9b4a35;
            --gold:       #c9a84c;
            --shadow:     rgba(61,43,31,0.18);
        }
 
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--parchment);
            color: var(--ink);
            min-height: 100vh;
            padding: 0 16px 32px;
            position: relative;
        }
 
        /* Текстура бумаги через повторяющийся градиент */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 28px,
                    rgba(139,105,20,0.04) 28px,
                    rgba(139,105,20,0.04) 29px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 60px,
                    rgba(139,105,20,0.02) 60px,
                    rgba(139,105,20,0.02) 61px
                );
            pointer-events: none;
            z-index: 0;
        }
 
        /* Виньетка по краям */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(61,43,31,0.12) 100%);
            pointer-events: none;
            z-index: 0;
        }
 
        * { position: relative; z-index: 1; }
 
        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--cappuccino);
            margin-bottom: 24px;
        }
        .header-center { text-align: center; flex: 1; }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 1px;
        }
        .header p {
            font-family: 'Crimson Text', serif;
            font-style: italic;
            font-size: 13px;
            color: var(--ink-light);
            margin-top: 3px;
        }
        .seal-icon {
            font-size: 26px;
            line-height: 1;
        }
 
        .profile-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--paper);
            border: 1.5px solid var(--cappuccino);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px var(--shadow);
            transition: background .2s;
        }
        .profile-btn:active { background: var(--paper-dark); }
 
        /* ── BUTTONS ── */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 6px;
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all .2s;
        }
        .btn-primary {
            background: var(--sealing);
            color: var(--parchment);
            box-shadow: 0 3px 10px rgba(122,48,34,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .btn-primary:active {
            background: var(--ink);
            box-shadow: 0 1px 4px rgba(122,48,34,0.3);
        }
 
        /* ── DECORATIVE DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0 20px;
            color: var(--cappuccino);
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cappuccino), transparent);
        }
 
        /* ── DEALS LIST ── */
        .deals-list h2 {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--latte);
            margin-bottom: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--cappuccino);
            font-style: italic;
            font-size: 15px;
        }
 
        /* ── DEAL CARD ── */
        .deal-card {
            background: var(--paper);
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid var(--paper-dark);
            box-shadow: 0 2px 8px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all .2s;
            position: relative;
            overflow: hidden;
        }
        .deal-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--sealing);
            border-radius: 6px 0 0 6px;
        }
        .deal-card:active {
            box-shadow: 0 1px 4px var(--shadow);
            transform: translateY(1px);
        }
        .deal-card-desc {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
            color: var(--ink);
        }
        .deal-card-amount {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--ink);
        }
        .deal-card-status {
            font-size: 12px;
            font-style: italic;
            color: var(--ink-light);
            margin-top: 4px;
        }
 
        /* fade-in */
        .fade-in { animation: fadeUp .4s ease both; }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(8px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s}
    </style>
</head>
<body>
    <div class="header fade-in">
        <span class="seal-icon">⚖️</span>
        <div class="header-center">
            <h1>ГАРАНТЪ</h1>
            <p>Надёжные сделки с честью</p>
        </div>
        <button class="profile-btn" onclick="window.location.href='profile.html'" title="Профиль">👤</button>
    </div>
 
    <button class="btn btn-primary fade-in d1" onclick="createDeal()">
        + Составить грамоту о сделке
    </button>
 
    <div class="divider fade-in d2">✦</div>
 
    <div class="deals-list fade-in d3">
        <h2>Текущие сделки</h2>
        <div class="empty-state" id="empty-state">
            Записей о сделках не найдено
        </div>
        <div id="deals-container"></div>
    </div>
 
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
 
        const BACKEND = 'https://garant-backend-production.up.railway.app';
        const currentUserId = tg.initDataUnsafe?.user?.id || 0;
 
        function createDeal() { window.location.href = 'create.html'; }
 
        async function loadDeals() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`${BACKEND}/users/${currentUserId}/deals`);
                const data = await res.json();
                if (!data.success || !data.deals.length) return;
                const activeDeals = data.deals.filter(d =>
                    d.status === 'pending' || d.status === 'active' || d.status === 'dispute');
                if (!activeDeals.length) return;
 
                const container = document.getElementById('deals-container');
                document.getElementById('empty-state').style.display = 'none';
 
                const statusMap = {
                    'pending': '🕯 Ожидает покупателя',
                    'active':  '📜 Активна',
                    'dispute': '⚔️ Спор'
                };
 
                container.innerHTML = activeDeals.map(deal => `
                    <div class="deal-card" onclick="openDeal('${deal.id}')">
                        <div class="deal-card-desc">${deal.description}</div>
                        <div class="deal-card-amount">${parseInt(deal.amount).toLocaleString()} ₽</div>
                        <div class="deal-card-status">${statusMap[deal.status] || deal.status}</div>
                    </div>
                `).join('');
            } catch(e) { console.log(e); }
        }
 
        function openDeal(id) { window.location.href = `deal.html?id=${id}`; }
        loadDeals();
    </script>
</body>
</html>
