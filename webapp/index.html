<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гарант</title>
    <meta name="ngrok-skip-browser-warning" content="true">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:         #1a1208;
            --bg2:        #241a0e;
            --bg3:        #2e2010;
            --border:     #4a3520;
            --text:       #e8d5b0;
            --text-dim:   #a08060;
            --gold:       #c9a84c;
            --gold-dim:   #8b6914;
            --sealing:    #7a3022;
            --sealing-lt: #9b4a35;
            --green:      #4a7a50;
            --shadow:     rgba(0,0,0,0.5);
        }
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 32px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(201,168,76,0.02) 28px, rgba(201,168,76,0.02) 29px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        /* ── HEADER ── */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .header-center { text-align: center; flex: 1; }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px; font-weight: 700;
            color: var(--gold); letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(201,168,76,0.3);
        }
        .header p { font-style: italic; font-size: 13px; color: var(--text-dim); margin-top: 3px; }
        .seal-icon { font-size: 26px; line-height: 1; }
        .profile-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--bg2); border: 1px solid var(--border);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--shadow); transition: background .2s;
        }
        .profile-btn:active { background: var(--bg3); }

        /* ── CREATE BUTTON ── */
        .btn-create {
            display: block; width: 100%; padding: 15px;
            border-radius: 6px; border: none;
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; margin-bottom: 16px; transition: all .2s;
            background: var(--sealing); color: var(--text);
            box-shadow: 0 3px 12px rgba(122,48,34,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .btn-create:active { background: #5a2018; }

        /* ── TABS ── */
        .tabs {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-bottom: 16px;
        }
        .tab {
            padding: 10px; border-radius: 6px;
            font-family: 'Cinzel', serif;
            font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; border: 1px solid var(--border);
            background: transparent; color: var(--text-dim);
            transition: all .2s; text-align: center;
        }
        .tab.active {
            background: var(--bg2); color: var(--gold);
            border-color: var(--gold-dim);
        }
        .tab:active { opacity: 0.7; }

        /* ── DEAL CARD (мои сделки) ── */
        .deal-card {
            background: var(--bg2);
            border-radius: 6px; padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow);
            cursor: pointer; transition: all .2s;
            position: relative; overflow: hidden;
        }
        .deal-card::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--sealing);
        }
        .deal-card.active-deal::before { background: var(--gold-dim); }
        .deal-card.dispute-deal::before { background: var(--sealing-lt); }
        .deal-card:active { opacity: 0.7; transform: translateY(1px); }
        .deal-card-desc { font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text); }
        .deal-card-amount { font-family: 'Cinzel', serif; font-size: 19px; font-weight: 700; color: var(--gold); }
        .deal-card-status { font-size: 12px; font-style: italic; color: var(--text-dim); margin-top: 4px; }

        /* ── FEED CARD (лента) ── */
        .feed-card {
            background: var(--bg2);
            border-radius: 6px; padding: 12px 14px; margin-bottom: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px var(--shadow);
            position: relative; overflow: hidden;
            animation: fadeUp .3s ease both;
        }
        .feed-card::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        }
        .feed-card.feed-pending::before  { background: var(--gold); }
        .feed-card.feed-active::before   { background: var(--gold-dim); }
        .feed-card.feed-completed::before{ background: var(--green); }
        .feed-card.feed-dispute::before  { background: var(--sealing-lt); }

        .feed-row {
            display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
        }
        .feed-desc {
            font-size: 15px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1;
        }
        .feed-amount {
            font-family: 'Cinzel', serif;
            font-size: 15px; font-weight: 700; color: var(--gold);
            flex-shrink: 0;
        }
        .feed-meta {
            display: flex; justify-content: space-between;
            margin-top: 5px; font-size: 11px; font-style: italic; color: var(--text-dim);
        }

        /* live dot */
        .live-dot {
            display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--gold);
            animation: pulse 2s ease-in-out infinite;
            margin-right: 5px; vertical-align: middle;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── ПУСТОЙ ЭКРАН ── */
        .empty-screen {
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            padding: 30px 20px;
        }
        .empty-art {
            width: 130px; height: 130px; border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(201,168,76,0.12), rgba(139,105,20,0.03));
            border: 1px solid rgba(201,168,76,0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 56px; margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(201,168,76,0.1);
            animation: emptyFloat 4s ease-in-out infinite;
        }
        @keyframes emptyFloat {
            0%,100% { transform: translateY(0); box-shadow: 0 0 40px rgba(201,168,76,0.1); }
            50%      { transform: translateY(-8px); box-shadow: 0 12px 50px rgba(201,168,76,0.18); }
        }
        .empty-title {
            font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700;
            color: var(--gold); margin-bottom: 10px; letter-spacing: 0.5px;
        }
        .empty-desc {
            font-size: 15px; font-style: italic;
            color: var(--text-dim); line-height: 1.7;
            margin-bottom: 24px; max-width: 260px;
        }
        .empty-desc b { font-style: normal; color: var(--text); }
        .btn-empty {
            padding: 13px 28px;
            border-radius: 6px; border: none;
            font-family: 'Cinzel', serif;
            font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: all .2s;
            background: var(--sealing); color: var(--text);
            box-shadow: 0 3px 12px rgba(122,48,34,0.4);
        }
        .btn-empty:active { transform: scale(0.96); }

        /* ── SECTION TITLE ── */
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        /* ── GEAR ── */
        .gear { display: inline-block; animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ── ANIMATIONS ── */
        .fade-in { animation: fadeUp .4s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s}

        /* skeleton */
        .skel {
            background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite; border-radius: 4px; height: 14px; margin-bottom: 6px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    </style>
</head>
<body>
    <div class="header fade-in">
        <span class="seal-icon">⚖️</span>
        <div class="header-center">
            <h1>ГАРАНТЪ</h1>
            <p>Надёжные сделки с честью</p>
        </div>
        <button class="profile-btn" onclick="window.location.href='profile.html'">👤</button>
    </div>

    <button class="btn-create fade-in d1" onclick="createDeal()">
        + Составить грамоту о сделке
    </button>

    <!-- Вкладки -->
    <div class="tabs fade-in d2">
        <button class="tab active" id="tab-my" onclick="switchTab('my')">📋 Мои сделки</button>
        <button class="tab" id="tab-feed" onclick="switchTab('feed')">🌐 Лента сделок</button>
    </div>

    <!-- Мои сделки -->
    <div id="panel-my" class="fade-in d3">
        <div class="section-title">Активные и ожидающие</div>
        <div class="empty-screen" id="my-empty">
            <div class="empty-art">📜</div>
            <div class="empty-title">Грамот пока нет</div>
            <div class="empty-desc">
                Создайте первую сделку и отправьте ссылку покупателю —
                <b>деньги будут в безопасности</b> до подтверждения обеих сторон
            </div>
            <button class="btn-empty" onclick="createDeal()">
                + Создать первую сделку
            </button>
        </div>
        <div id="my-container"></div>
    </div>

    <!-- Лента всех сделок -->
    <div id="panel-feed" style="display:none">
        <div class="section-title">
            <span class="live-dot"></span> В реальном времени
        </div>
        <div id="feed-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Показываем онбординг новым пользователям
        if (!localStorage.getItem('garant_onboarding_done')) {
            window.location.href = 'onboarding.html';
        }

        const BACKEND = 'https://garant-backend-production.up.railway.app';
        const currentUserId = tg.initDataUnsafe?.user?.id || 0;
        let feedInterval = null;

        function createDeal() { window.location.href = 'create.html'; }
        function openDeal(id) { window.location.href = `deal.html?id=${id}`; }

        // ── TABS ──────────────────────────────────────────────
        function switchTab(tab) {
            document.getElementById('panel-my').style.display   = tab === 'my'   ? 'block' : 'none';
            document.getElementById('panel-feed').style.display = tab === 'feed' ? 'block' : 'none';
            document.getElementById('tab-my').classList.toggle('active',   tab === 'my');
            document.getElementById('tab-feed').classList.toggle('active', tab === 'feed');

            if (tab === 'feed') {
                loadFeed();
                feedInterval = setInterval(loadFeed, 30000);
            } else {
                clearInterval(feedInterval);
            }
        }

        // ── МОИ СДЕЛКИ ────────────────────────────────────────
        async function loadMyDeals() {
            if (!currentUserId) return;
            try {
                const res  = await fetch(`${BACKEND}/users/${currentUserId}/deals`);
                const data = await res.json();
                if (!data.success || !data.deals.length) return;

                const active = data.deals.filter(d =>
                    d.status === 'pending' || d.status === 'active' || d.status === 'dispute');
                if (!active.length) return;

                document.getElementById('my-empty').style.display = 'none';

                const statusMap = {
                    'pending': '🕯 Ожидает покупателя',
                    'active':  '📜 Активна',
                    'dispute': '⚔️ Спор'
                };
                const clsMap = { 'active': 'active-deal', 'dispute': 'dispute-deal' };

                document.getElementById('my-container').innerHTML = active.map(deal => `
                    <div class="deal-card ${clsMap[deal.status] || ''}" onclick="openDeal('${deal.id}')">
                        <div class="deal-card-desc">
                            ${deal.description}
                            ${(deal.status === 'active' || deal.status === 'dispute') ? ' <span class="gear">⚙️</span>' : ''}
                        </div>
                        <div class="deal-card-amount">${parseInt(deal.amount).toLocaleString()} ₽</div>
                        <div class="deal-card-status">${statusMap[deal.status] || deal.status}</div>
                    </div>
                `).join('');
            } catch(e) { console.log(e); }
        }

        // ── ЛЕНТА ─────────────────────────────────────────────
        async function loadFeed() {
            const container = document.getElementById('feed-container');

            // скелетон при первой загрузке
            if (!container.innerHTML) {
                container.innerHTML = Array(5).fill(`
                    <div class="feed-card">
                        <div class="skel" style="width:70%"></div>
                        <div class="skel" style="width:40%"></div>
                    </div>`).join('');
            }

            try {
                const res  = await fetch(`${BACKEND}/feed`);
                const data = await res.json();
                if (!data.success || !data.deals.length) {
                    container.innerHTML = `<div class="empty-state">Сделок пока нет</div>`;
                    return;
                }

                const statusMap = {
                    'pending':   ['🕯 Ожидает покупателя', 'feed-pending'],
                    'active':    ['📜 В процессе',         'feed-active'],
                    'completed': ['✅ Завершена',           'feed-completed'],
                    'dispute':   ['⚔️ Спор',               'feed-dispute'],
                };

                container.innerHTML = data.deals.map(deal => {
                    const [statusText, cls] = statusMap[deal.status] || ['📋 Сделка', 'feed-active'];
                    const amount = parseInt(deal.amount).toLocaleString();
                    const date = deal.created_at
                        ? timeAgo(new Date(deal.created_at)) : '';
                    return `
                    <div class="feed-card ${cls}">
                        <div class="feed-row">
                            <div class="feed-desc">${escHtml(deal.description)}</div>
                            <div class="feed-amount">${amount} ₽</div>
                        </div>
                        <div class="feed-meta">
                            <span>${statusText}</span>
                            <span>${date}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch(e) { console.log(e); }
        }

        // ── HELPERS ───────────────────────────────────────────
        function timeAgo(date) {
            const diff = (Date.now() - date) / 1000;
            if (diff < 60)   return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
            if (diff < 86400)return Math.floor(diff / 3600) + ' ч назад';
            return Math.floor(diff / 86400) + ' дн назад';
        }
        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // ── INIT ──────────────────────────────────────────────
        loadMyDeals();
    </script>
</body>
</html>
