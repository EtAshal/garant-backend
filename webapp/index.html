<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гарант</title>
    <meta name="ngrok-skip-browser-warning" content="true">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:         #1a1208;
            --bg2:        #241a0e;
            --bg3:        #2e2010;
            --border:     #4a3520;
            --text:       #e8d5b0;
            --text-dim:   #a08060;
            --gold:       #c9a84c;
            --gold-dim:   #8b6914;
            --sealing:    #7a3022;
            --sealing-lt: #9b4a35;
            --green:      #4a7a50;
            --shadow:     rgba(0,0,0,0.5);
            --candle:     rgba(201,168,76,0.06);
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 32px;
        }

        /* свечное свечение сверху */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(201,168,76,0.02) 28px, rgba(201,168,76,0.02) 29px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .header-center { text-align: center; flex: 1; }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px; font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(201,168,76,0.3);
        }
        .header p {
            font-style: italic; font-size: 13px;
            color: var(--text-dim); margin-top: 3px;
        }
        .seal-icon { font-size: 26px; line-height: 1; }

        .profile-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--bg2);
            border: 1px solid var(--border);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background .2s;
        }
        .profile-btn:active { background: var(--bg3); }

        .btn {
            display: block; width: 100%; padding: 15px;
            border-radius: 6px; border: none;
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; margin-bottom: 12px; transition: all .2s;
        }
        .btn-primary {
            background: var(--sealing);
            color: var(--text);
            box-shadow: 0 3px 12px rgba(122,48,34,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .btn-primary:active { background: #5a2018; }

        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 4px 0 20px; color: var(--border); font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .deals-list h2 {
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 14px;
        }
        .empty-state {
            text-align: center; padding: 40px 0;
            color: var(--text-dim); font-style: italic; font-size: 15px;
        }

        .deal-card {
            background: var(--bg2);
            border-radius: 6px; padding: 14px 16px; margin-bottom: 10px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
            cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
        }
        .deal-card::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--sealing);
        }
        .deal-card:active { opacity: 0.7; transform: translateY(1px); }
        .deal-card-desc { font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text); }
        .deal-card-amount {
            font-family: 'Cinzel', serif;
            font-size: 19px; font-weight: 700; color: var(--gold);
        }
        .deal-card-status { font-size: 12px; font-style: italic; color: var(--text-dim); margin-top: 4px; }

        .fade-in { animation: fadeUp .4s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s}

        .gear {
            display: inline-block;
            animation: spin 3s linear infinite;
            transform-origin: center;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header fade-in">
        <span class="seal-icon">⚖️</span>
        <div class="header-center">
            <h1>ГАРАНТЪ</h1>
            <p>Надёжные сделки с честью</p>
        </div>
        <button class="profile-btn" onclick="window.location.href='profile.html'">👤</button>
    </div>

    <button class="btn btn-primary fade-in d1" onclick="createDeal()">
        + Составить грамоту о сделке
    </button>

    <div class="divider fade-in d2">✦</div>

    <div class="deals-list fade-in d3">
        <h2>Текущие сделки</h2>
        <div class="empty-state" id="empty-state">Записей о сделках не найдено</div>
        <div id="deals-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const BACKEND = 'https://garant-backend-production.up.railway.app';
        const currentUserId = tg.initDataUnsafe?.user?.id || 0;

        function createDeal() { window.location.href = 'create.html'; }

        async function loadDeals() {
            if (!currentUserId) return;
            try {
                const res = await fetch(`${BACKEND}/users/${currentUserId}/deals`);
                const data = await res.json();
                if (!data.success || !data.deals.length) return;
                const activeDeals = data.deals.filter(d =>
                    d.status === 'pending' || d.status === 'active' || d.status === 'dispute');
                if (!activeDeals.length) return;
                const container = document.getElementById('deals-container');
                document.getElementById('empty-state').style.display = 'none';
                const statusMap = {
                    'pending': '🕯 Ожидает покупателя',
                    'active':  '📜 Активна',
                    'dispute': '⚔️ Спор'
                };
                container.innerHTML = activeDeals.map(deal => `
                    <div class="deal-card" onclick="openDeal('${deal.id}')">
                        <div class="deal-card-desc">${deal.description}${(deal.status === 'active' || deal.status === 'dispute') ? ' <span class="gear">⚙️</span>' : ''}</div>
                        <div class="deal-card-amount">${parseInt(deal.amount).toLocaleString()} ₽</div>
                        <div class="deal-card-status">${statusMap[deal.status] || deal.status}</div>
                    </div>
                `).join('');
            } catch(e) { console.log(e); }
        }

        function openDeal(id) { window.location.href = `deal.html?id=${id}`; }
        loadDeals();
    </script>
</body>
</html>
