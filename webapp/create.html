<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая сделка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:         #1a1208;
            --bg2:        #241a0e;
            --bg3:        #2e2010;
            --border:     #4a3520;
            --text:       #e8d5b0;
            --text-dim:   #a08060;
            --gold:       #c9a84c;
            --gold-dim:   #8b6914;
            --sealing:    #7a3022;
            --sealing-lt: #9b4a35;
            --shadow:     rgba(0,0,0,0.5);
        }
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 40px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(201,168,76,0.02) 28px, rgba(201,168,76,0.02) 29px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 24px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .back-btn {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 50%; width: 36px; height: 36px;
            font-size: 18px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--shadow); font-family: serif;
        }
        .back-btn:active { background: var(--bg3); }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 18px; font-weight: 700;
            letter-spacing: 0.5px; color: var(--gold);
        }

        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 8px;
        }
        input, textarea {
            width: 100%; padding: 13px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text);
            font-size: 17px; font-family: 'Crimson Text', serif;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, textarea:focus {
            border-color: var(--gold-dim);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 0 2px rgba(201,168,76,0.1);
        }
        input::placeholder, textarea::placeholder { color: var(--text-dim); }
        textarea { height: 100px; resize: none; }
        .amount-wrapper { position: relative; }
        .amount-wrapper input { padding-right: 36px; }
        .currency {
            position: absolute; right: 13px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-family: 'Cinzel', serif; font-size: 15px;
        }
        .hint { font-size: 12px; font-style: italic; color: var(--text-dim); margin-top: 5px; }

        .commission-info {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold-dim);
            border-radius: 6px; padding: 12px 14px;
            font-size: 14px; font-style: italic;
            color: var(--text-dim); line-height: 1.7;
        }
        .commission-info b { font-style: normal; font-weight: 600; color: var(--text); }

        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 20px 0; color: var(--border); font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .btn {
            display: block; width: 100%; padding: 15px;
            border-radius: 6px; border: none;
            font-family: 'Cinzel', serif;
            font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: all .2s;
        }
        .btn-primary {
            background: var(--sealing); color: var(--text);
            box-shadow: 0 3px 12px rgba(122,48,34,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .btn-primary:active { background: #5a2018; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .fade-in { animation: fadeUp .35s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s} .d4{animation-delay:.2s}

        /* ── КОНФЕТТИ ── */
        .confetti-overlay {
            position: fixed; inset: 0; z-index: 999;
            pointer-events: none; overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 10px; height: 10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* Вспышка золотого света */
        .flash-overlay {
            position: fixed; inset: 0; z-index: 998;
            background: radial-gradient(ellipse at center, rgba(201,168,76,0.4) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0;
            animation: flashIn .6s ease forwards;
        }
        @keyframes flashIn {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Карточка успеха */
        .success-card {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1000;
            background: var(--bg2);
            border: 1px solid var(--gold-dim);
            border-radius: 20px; padding: 32px 28px;
            text-align: center; width: 280px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(201,168,76,0.2);
            animation: successPop .5s cubic-bezier(.34,1.56,.64,1) .1s forwards;
        }
        @keyframes successPop {
            0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
        }
        .success-icon {
            font-size: 56px; margin-bottom: 12px; line-height: 1;
            animation: iconBounce .6s cubic-bezier(.34,1.56,.64,1) .4s both;
        }
        @keyframes iconBounce {
            0%   { transform: scale(0) rotate(-30deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .success-title {
            font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700;
            color: var(--gold); margin-bottom: 8px; letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(201,168,76,0.4);
        }
        .success-desc {
            font-size: 14px; font-style: italic;
            color: var(--text-dim); line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header fade-in">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>Составить грамоту</h1>
    </div>

    <div class="form-group fade-in d1">
        <label>Сумма сделки</label>
        <div class="amount-wrapper">
            <input type="number" id="amount" placeholder="0" min="100" oninput="updateCommission()">
            <span class="currency">₽</span>
        </div>
        <div class="hint">Не менее 100 рублей</div>
        <div class="hint" id="limit-hint" style="margin-top:4px;color:var(--text-dim)">Загрузка лимита…</div>
    </div>

    <div class="form-group fade-in d2">
        <label>Описание товара или услуги</label>
        <textarea id="description" placeholder="Например: iPhone 14 Pro, 256GB, чёрный, новый в коробке"></textarea>
    </div>

    <div class="commission-info fade-in d3" id="commission-info">
        Укажите сумму, дабы увидеть расчёт комиссии
    </div>

    <div class="divider fade-in d3">✦</div>

    <button class="btn btn-primary fade-in d4" id="create-btn" onclick="createDeal()" disabled>
        Скрепить сделку печатью
    </button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ── ЗВУКИ ─────────────────────────────────────────────
        let audioCtx = null;
        function getCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }
        function playTone(freq, type, duration, volume = 0.3, delay = 0) {
            try {
                const ctx = getCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
                gain.gain.setValueAtTime(0, ctx.currentTime + delay);
                gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + delay + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + duration);
            } catch(e) {}
        }
        function playNoise(duration, volume = 0.05) {
            try {
                const ctx = getCtx();
                const bufferSize = ctx.sampleRate * duration;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass'; filter.frequency.value = 800;
                source.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                source.start(); source.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
        function soundSeal() {
            playNoise(0.08, 0.3);
            playTone(110, 'sine', 0.4, 0.2, 0.05);
            playTone(80,  'sine', 0.6, 0.15, 0.15);
        }
        function soundFanfare() {
            playTone(523, 'triangle', 0.15, 0.2);
            playTone(659, 'triangle', 0.15, 0.2, 0.15);
            playTone(784, 'triangle', 0.15, 0.2, 0.30);
            playTone(1047,'triangle', 0.4,  0.3, 0.45);
            playTone(1319,'triangle', 0.6,  0.25, 0.55);
        }

        function goBack() { window.location.href = 'index.html'; }

        // ── ЛИМИТЫ ПО СТАТУСУ ─────────────────────────────────
        const LIMITS = [
            { min: 1500, limit: null,   name: '⭐ Гарант',      label: 'без лимита' },
            { min: 500,  limit: 200000, name: '🛡️ Надёжный',   label: '200 000 ₽' },
            { min: 100,  limit: 50000,  name: '📜 Проверенный', label: '50 000 ₽' },
            { min: 0,    limit: 10000,  name: '🆕 Новичок',     label: '10 000 ₽' },
        ];

        let userPts = 0;
        let userLimit = 10000;

        async function loadUserLimit() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) return;
            try {
                const res  = await fetch(`https://garant-backend-production.up.railway.app/users/${userId}/deals`);
                const data = await res.json();
                if (!data.success) return;

                const completed = data.deals.filter(d => d.status === 'completed');
                const asSeller  = completed.filter(d => d.seller_id == userId);
                const asBuyer   = completed.filter(d => d.buyer_id  == userId);
                userPts = [...asSeller, ...asBuyer].reduce((s, d) => s + Math.floor(parseFloat(d.amount) / 100), 0);

                const lvl = LIMITS.find(l => userPts >= l.min);
                userLimit = lvl.limit;

                // Показываем лимит под полем суммы
                const hintEl = document.getElementById('limit-hint');
                if (lvl.limit) {
                    hintEl.innerHTML = `${lvl.name} · Лимит: <b>${lvl.limit.toLocaleString('ru')} ₽</b>`;
                } else {
                    hintEl.innerHTML = `${lvl.name} · <b>Без лимита</b> 🎉`;
                    hintEl.style.color = 'var(--green, #4a7a50)';
                }

                // Обновляем placeholder и max
                const input = document.getElementById('amount');
                input.max = lvl.limit || 99999999;
                input.placeholder = lvl.limit ? `до ${lvl.limit.toLocaleString('ru')}` : '0';

            } catch(e) {}
        }

        function getCommission(amount) {
            if (amount <= 10000) return 0.01;
            if (amount <= 25000) return 0.02;
            if (amount <= 50000) return 0.03;
            if (amount <= 100000) return 0.04;
            return 0.05;
        }

        function updateCommission() {
            const amount = parseFloat(document.getElementById('amount').value);
            const btn = document.getElementById('create-btn');
            const info = document.getElementById('commission-info');
            const desc = document.getElementById('description').value;

            // Проверяем лимит
            const overLimit = userLimit && amount > userLimit;

            if (amount >= 100 && desc.length > 0 && !overLimit) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }

            if (overLimit) {
                info.innerHTML = `⚠️ Превышен лимит для вашего статуса — <b>${userLimit.toLocaleString('ru')} ₽</b>.<br>Завершите больше сделок чтобы повысить статус.`;
                info.style.borderLeftColor = 'var(--sealing, #7a3022)';
                return;
            }

            info.style.borderLeftColor = 'var(--gold-dim, #8b6914)';

            if (amount >= 100) {
                const rate = getCommission(amount);
                const commission = Math.round(amount * rate);
                const sellerGets = amount - commission;
                info.innerHTML = `
                    💰 Покупатель вносит: <b>${amount.toLocaleString()} ₽</b><br>
                    📜 Мзда Гаранту: <b>${commission.toLocaleString()} ₽</b> (${rate * 100}%)<br>
                    ✅ Продавец получит: <b>${sellerGets.toLocaleString()} ₽</b>
                `;
            } else {
                info.innerHTML = 'Укажите сумму, дабы увидеть расчёт комиссии';
            }
        }

        document.getElementById('description').addEventListener('input', updateCommission);
        loadUserLimit();

        // ── КОНФЕТТИ ─────────────────────────────────────────
        function launchConfetti() {
            // Вспышка
            const flash = document.createElement('div');
            flash.className = 'flash-overlay';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 700);

            // Вибрация
            if (navigator.vibrate) navigator.vibrate([50, 30, 80]);

            // Конфетти
            const colors = [
                '#c9a84c', '#f5d06a', '#e8d5b0',  // золото/пергамент
                '#7a3022', '#9b4a35',               // сургуч
                '#4a7a50', '#7acc84',               // зелень
                '#ffffff', '#a08060'                // белый/капучино
            ];
            const shapes = ['🪙', '⭐', '✦', '◆', '▲'];
            const overlay = document.createElement('div');
            overlay.className = 'confetti-overlay';
            document.body.appendChild(overlay);

            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                const isEmoji = Math.random() > 0.6;

                if (isEmoji) {
                    piece.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                    piece.style.cssText = `
                        position: absolute;
                        top: -30px;
                        left: ${Math.random() * 100}%;
                        font-size: ${10 + Math.random() * 16}px;
                        animation: confettiFall ${1.5 + Math.random() * 2}s linear ${Math.random() * 0.8}s forwards;
                    `;
                } else {
                    piece.className = 'confetti-piece';
                    piece.style.cssText = `
                        left: ${Math.random() * 100}%;
                        width: ${6 + Math.random() * 8}px;
                        height: ${6 + Math.random() * 8}px;
                        background: ${colors[Math.floor(Math.random() * colors.length)]};
                        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                        animation-duration: ${1.5 + Math.random() * 2}s;
                        animation-delay: ${Math.random() * 0.8}s;
                    `;
                }
                overlay.appendChild(piece);
            }

            setTimeout(() => overlay.remove(), 3500);
        }

        function showSuccessCard(amount, description) {
            const card = document.createElement('div');
            card.className = 'success-card';
            card.innerHTML = `
                <div class="success-icon">📜</div>
                <div class="success-title">Грамота составлена!</div>
                <div class="success-desc">
                    Сделка на <b style="color:var(--gold);font-style:normal">${amount.toLocaleString()} ₽</b><br>
                    Ссылка скопирована в буфер обмена
                </div>
            `;
            document.body.appendChild(card);
            return card;
        }

        async function createDeal() {
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;
            if (!amount || amount < 100 || !description) return;
            const btn = document.getElementById('create-btn');
            btn.disabled = true;
            btn.textContent = 'Составляем...';
            try {
                const response = await fetch('https://garant-backend-production.up.railway.app/deals/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seller_id: tg.initDataUnsafe?.user?.id || 0,
                        amount, description
                    })
                });
                const data = await response.json();
                if (data.success) {
                    const dealUrl = `https://etashal.github.io/garant-webapp/deal.html?id=${data.deal_id}`;
                    await navigator.clipboard.writeText(dealUrl);

                    // Звук печати сургуча + фанфары
                    soundSeal();
                    setTimeout(() => soundFanfare(), 300);

                    // Запускаем конфетти и карточку успеха
                    launchConfetti();
                    const card = showSuccessCard(amount, description);

                    // Через 2.5 секунды переходим на главную
                    setTimeout(() => {
                        card.remove();
                        window.location.href = 'index.html';
                    }, 2500);

                } else {
                    tg.showAlert('Ошибка: ' + data.error);
                    btn.disabled = false;
                    btn.textContent = 'Скрепить сделку печатью';
                }
            } catch(e) {
                tg.showAlert('Ошибка соединения с сервером');
                btn.disabled = false;
                btn.textContent = 'Скрепить сделку печатью';
            }
        }
    </script>
</body>
</html>
