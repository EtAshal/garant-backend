<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сделка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="sounds.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:         #1a1208;
            --bg2:        #241a0e;
            --bg3:        #2e2010;
            --border:     #4a3520;
            --text:       #e8d5b0;
            --text-dim:   #a08060;
            --gold:       #c9a84c;
            --gold-dim:   #8b6914;
            --sealing:    #7a3022;
            --sealing-lt: #9b4a35;
            --green:      #4a7a50;
            --shadow:     rgba(0,0,0,0.5);
        }
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 16px 40px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%),
                repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(201,168,76,0.02) 28px, rgba(201,168,76,0.02) 29px);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 24px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .back-btn {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 50%; width: 36px; height: 36px;
            font-size: 18px; cursor: pointer; color: var(--text);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--shadow); font-family: serif;
        }
        .back-btn:active { background: var(--bg3); }
        h1 { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); }

        .status-badge {
            display: inline-block; padding: 5px 14px; border-radius: 4px;
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 18px; border: 1px solid;
        }
        .status-pending   { background: rgba(201,168,76,0.1);  color: var(--gold);    border-color: var(--gold-dim); }
        .status-active    { background: rgba(139,105,20,0.1);  color: var(--text);    border-color: var(--border); }
        .status-completed { background: rgba(74,122,80,0.15);  color: #7acc84;        border-color: var(--green); }
        .status-cancelled { background: rgba(122,48,34,0.15);  color: var(--sealing-lt); border-color: var(--sealing); }

        .card {
            background: var(--bg2); border-radius: 6px; padding: 14px 16px;
            margin-bottom: 12px; border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .card-label {
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 5px;
        }
        .card-value { font-size: 17px; font-weight: 600; color: var(--text); }
        .amount-value {
            font-family: 'Cinzel', serif;
            font-size: 30px; font-weight: 700; color: var(--gold);
            text-shadow: 0 0 20px rgba(201,168,76,0.2);
        }
        .commission-note { font-size: 13px; font-style: italic; color: var(--text-dim); margin-top: 4px; }

        .timer-card {
            background: var(--bg2); border-radius: 6px; padding: 14px 16px;
            margin-bottom: 12px; border: 1px solid var(--border);
            border-left: 3px solid var(--gold-dim);
            box-shadow: 0 2px 10px var(--shadow);
        }
        .timer-label {
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--gold-dim); margin-bottom: 8px;
        }
        .timer-bar-wrap {
            background: rgba(255,255,255,0.06); border-radius: 4px;
            height: 6px; overflow: hidden; margin-bottom: 6px;
        }
        .timer-bar-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, var(--gold-dim), var(--sealing));
            transition: width .5s ease;
        }
        .timer-text { font-size: 13px; font-style: italic; color: var(--text-dim); }
        .timer-text b { font-style: normal; color: var(--text); }

        .dispute-warning {
            background: rgba(122,48,34,0.15);
            border: 1px solid var(--sealing);
            border-radius: 6px; padding: 12px 14px; margin-bottom: 12px;
            font-size: 14px; font-style: italic; color: var(--sealing-lt); line-height: 1.5;
        }

        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 16px 0; color: var(--border); font-size: 12px;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }

        .btn {
            display: block; width: 100%; padding: 15px;
            border-radius: 6px; border: none;
            font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600;
            letter-spacing: 0.4px; cursor: pointer; margin-bottom: 10px; transition: all .2s;
        }
        .btn-confirm {
            background: var(--green); color: var(--text);
            box-shadow: 0 3px 12px rgba(74,122,80,0.4);
        }
        .btn-confirm:active { background: #3a6040; }
        .btn-cancel {
            background: var(--sealing); color: var(--text);
            box-shadow: 0 3px 12px rgba(122,48,34,0.5);
        }
        .btn-cancel:active { background: #5a2018; }
        .btn-accept {
            background: var(--bg3); color: var(--text);
            border: 1px solid var(--gold-dim);
            box-shadow: 0 3px 12px var(--shadow);
        }
        .btn-accept:active { background: var(--border); }
        .btn-dispute {
            background: transparent; color: var(--sealing-lt);
            border: 1px solid var(--sealing);
            font-size: 12px; padding: 11px;
        }
        .btn-dispute:active { background: rgba(122,48,34,0.15); }
        .btn-copy {
            background: transparent; color: var(--text-dim);
            border: 1px solid var(--border);
            font-size: 13px; padding: 12px;
        }
        .btn-copy:active { background: var(--bg3); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── ТОСТ ── */
        .toast {
            position: fixed; bottom: 100px; left: 50%; z-index: 999;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg2); border: 1px solid var(--sealing);
            border-radius: 10px; padding: 12px 20px;
            font-size: 14px; font-style: italic; color: var(--text);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            opacity: 0; pointer-events: none;
            transition: all .3s cubic-bezier(.34,1.56,.64,1);
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        .loading { text-align: center; padding: 50px 0; color: var(--text-dim); font-style: italic; font-size: 16px; }

        .fade-in { animation: fadeUp .35s ease both; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .d1{animation-delay:.05s} .d2{animation-delay:.1s} .d3{animation-delay:.15s}
    </style>
</head>
<body>
    <div class="header fade-in">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>Грамота о сделке</h1>
    </div>

    <div class="toast" id="toast"></div>
    <div id="loading" class="loading">Разворачиваем свиток...</div>
    <div id="content" style="display:none"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const BACKEND = 'https://garant-backend-production.up.railway.app';
        const params = new URLSearchParams(window.location.search);
        const dealId = params.get('id');
        const currentUserId = tg.initDataUnsafe?.user?.id || 0;

        async function loadDeal() {
            if (!dealId) { document.getElementById('loading').textContent = 'Грамота не найдена'; return; }
            try {
                const res = await fetch(`${BACKEND}/deals/${dealId}`);
                const data = await res.json();
                if (!data.success) { document.getElementById('loading').textContent = 'Грамота не найдена'; return; }
                renderDeal(data.deal, data.days_since_accepted);
            } catch(e) { document.getElementById('loading').textContent = 'Ошибка загрузки'; }
        }

        function getCommission(amount) {
            if (amount <= 10000) return 0.01;
            if (amount <= 25000) return 0.02;
            if (amount <= 50000) return 0.03;
            if (amount <= 100000) return 0.04;
            return 0.05;
        }

        function renderDeal(deal, daysPassed) {
            document.getElementById('loading').style.display = 'none';
            const content = document.getElementById('content');
            content.style.display = 'block';

            const isSeller = currentUserId == deal.seller_id;
            const isBuyer  = currentUserId == deal.buyer_id;
            const amount   = parseFloat(deal.amount);
            const commission = Math.round(amount * getCommission(amount));
            const sellerGets = amount - commission;

            const statusMap = {
                'pending':   ['Ожидает покупателя', 'status-pending'],
                'active':    ['Активна',            'status-active'],
                'completed': ['Завершена',          'status-completed'],
                'cancelled': ['Отменена',           'status-cancelled'],
                'dispute':   ['Спор',               'status-cancelled'],
            };
            const [statusText, statusClass] = statusMap[deal.status] || ['Неизвестно', 'status-pending'];

            // ── Таймер выплаты для завершённых сделок ──
            let payoutHtml = '';
            if (deal.status === 'completed' && isSeller) {
                const amount = parseFloat(deal.amount);
                const commission = Math.round(amount * getCommission(amount));
                const sellerGets = amount - commission;

                if (deal.payout_sent) {
                    payoutHtml = `
                        <div class="timer-card fade-in d1" style="border-left-color:var(--green)">
                            <div class="timer-label">Выплата завершена</div>
                            <div class="timer-text">💰 <b>Деньги переведены на ваш счёт</b></div>
                        </div>`;
                } else {
                    const updatedStr = deal.completed_at || deal.updated_at || deal.created_at;
                    const completedAt = updatedStr ? new Date(updatedStr) : new Date();
                    const hoursLeft = Math.max(0, 12 - (Date.now() - completedAt) / 3600000);
                    const h = Math.floor(hoursLeft);
                    const m = Math.floor((hoursLeft - h) * 60);
                    const pct = Math.min(100, Math.round((1 - hoursLeft / 12) * 100));

                    if (hoursLeft > 0) {
                        payoutHtml = `
                            <div class="timer-card fade-in d1" style="border-left-color:var(--green)">
                                <div class="timer-label">Выплата продавцу</div>
                                <div class="timer-bar-wrap">
                                    <div class="timer-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--green),var(--gold))"></div>
                                </div>
                                <div class="timer-text">
                                    Вы получите <b>${sellerGets.toLocaleString()} ₽</b> через <b>${h}ч ${m}м</b>
                                </div>
                            </div>`;
                    } else {
                        payoutHtml = `
                            <div class="timer-card fade-in d1" style="border-left-color:var(--green)">
                                <div class="timer-label">Выплата продавцу</div>
                                <div class="timer-bar-wrap">
                                    <div class="timer-bar-fill" style="width:100%;background:var(--green)"></div>
                                </div>
                                <div class="timer-text">
                                    💰 Выплата <b>${sellerGets.toLocaleString()} ₽</b> обрабатывается
                                </div>
                            </div>`;
                    }
                }
            }

            let timerHtml = '';
            if (deal.status === 'active' && daysPassed !== null && daysPassed !== undefined) {
                const pct = Math.min(100, Math.round((daysPassed / 7) * 100));
                const daysLeft = Math.max(0, 7 - daysPassed);
                const timeStr = daysLeft >= 1 ? `осталось ~${Math.ceil(daysLeft)} дн.` : `осталось ~${Math.round(daysLeft * 24)} ч.`;
                timerHtml = `
                    <div class="timer-card fade-in d1">
                        <div class="timer-label">Автозавершение</div>
                        <div class="timer-bar-wrap">
                            <div class="timer-bar-fill" style="width:${pct}%"></div>
                        </div>
                        <div class="timer-text">День <b>${Math.floor(daysPassed) + 1}</b> из 7 — ${timeStr}</div>
                    </div>`;
            }

            let buttonsHtml = '';
            if (deal.status === 'pending' && !isSeller) {
                // Кнопка всегда активна — при нехватке денег показываем тост
                buttonsHtml = `<button class="btn btn-accept" onclick="handleAccept(${amount})">📜 Принять сделку — внести ${amount.toLocaleString()} ₽</button>`;
            }
            if (deal.status === 'active') {
                if (isSeller && !deal.seller_action) {
                    buttonsHtml += `
                        <button class="btn btn-confirm" onclick="takeAction('confirm')">✅ Всё исполнено, подтверждаю</button>
                        <button class="btn btn-cancel"  onclick="takeAction('cancel')">❌ Отказываюсь от сделки</button>`;
                }
                if (isBuyer && !deal.buyer_action) {
                    buttonsHtml += `
                        <button class="btn btn-confirm" onclick="takeAction('confirm')">✅ Всё получено, подтверждаю</button>
                        <button class="btn btn-cancel"  onclick="takeAction('cancel')">❌ Отказываюсь от сделки</button>`;
                }
                if (isBuyer && daysPassed >= 2 && !deal.seller_action) {
                    buttonsHtml += `
                        <div class="dispute-warning">⚠️ Продавец не реагирует уже ${Math.floor(daysPassed)} дн. Вы можете открыть спор и передать дело арбитру.</div>
                        <button class="btn btn-dispute" onclick="openDispute()">⚔️ Открыть спор (продавец молчит)</button>`;
                }
            }

            content.innerHTML = `
                <span class="status-badge ${statusClass} fade-in">${statusText}</span>
                ${timerHtml}
                ${payoutHtml}
                <div class="card fade-in d1">
                    <div class="card-label">Сумма сделки</div>
                    <div class="amount-value">${amount.toLocaleString()} ₽</div>
                    <div class="commission-note">Продавец получит: ${sellerGets.toLocaleString()} ₽ (мзда: ${commission.toLocaleString()} ₽)</div>
                </div>
                <div class="card fade-in d1">
                    <div class="card-label">Предмет сделки</div>
                    <div class="card-value">${deal.description}</div>
                </div>
                <div class="card fade-in d1" style="border-left:3px solid var(--border)">
                    <div class="card-label">Номер грамоты</div>
                    <div style="font-size:11px;color:var(--text-dim);word-break:break-all;font-family:monospace">${deal.id}</div>
                </div>
                <div class="divider fade-in d2">⚖️</div>
                <button class="btn btn-copy fade-in d2" onclick="copyLink()">🔗 Скопировать ссылку на сделку</button>
                ${buttonsHtml}`;
        }

        async function copyLink() {
            const dealUrl = `https://etashal.github.io/garant-webapp/deal.html?id=${dealId}`;
            try {
                await navigator.clipboard.writeText(dealUrl);
                tg.showAlert('✅ Ссылка скопирована!\nОтправьте её покупателю.');
            } catch(e) {
                tg.showAlert('Ссылка: ' + dealUrl);
            }
        }

        // ── ЗВУКИ ─────────────────────────────────────────────
        let toastTimer = null;
        function showToast(msg, duration = 2500) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        }

        function handleAccept(amount) {
            // Пока нет реального баланса — показываем тост
            // После подключения ЮКассы сюда добавим проверку реального баланса
            showToast('💰 Недостаточно средств — пополните кошелёк');
        }

        async function acceptDeal() {
            GARANT_SOUNDS.coins();
            try {
                const res = await fetch(`${BACKEND}/deals/${dealId}/accept`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ buyer_id: currentUserId })
                });
                const data = await res.json();
                if (data.success) { tg.showAlert('Сделка принята! Средства надёжно заблокированы.'); loadDeal(); }
                else tg.showAlert('Ошибка: ' + data.error);
            } catch(e) { tg.showAlert('Ошибка соединения'); }
        }

        async function takeAction(action) {
            if (action === 'confirm') GARANT_SOUNDS.confirm();
            else GARANT_SOUNDS.cancel();
            try {
                const res = await fetch(`${BACKEND}/deals/${dealId}/action`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, action })
                });
                const data = await res.json();
                if (data.success) { tg.showAlert(data.message); loadDeal(); }
                else tg.showAlert('Ошибка: ' + data.error);
            } catch(e) { tg.showAlert('Ошибка соединения'); }
        }

        async function openDispute() {
            tg.showConfirm('⚔️ Открыть спор?\n\nДело будет передано арбитру. Деньги заморозятся до его решения.',
                async (confirmed) => {
                    if (!confirmed) return;
                    GARANT_SOUNDS.dispute();
                    try {
                        const res = await fetch(`${BACKEND}/deals/${dealId}/dispute`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ user_id: currentUserId })
                        });
                        const data = await res.json();
                        tg.showAlert(data.success ? data.message : 'Ошибка: ' + data.error);
                        if (data.success) loadDeal();
                    } catch(e) { tg.showAlert('Ошибка соединения'); }
                }
            );
        }

        function goBack() {
            if (document.referrer.includes('profile.html')) {
                sessionStorage.setItem('scrollToHistory', '1');
                window.location.href = 'profile.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        loadDeal();
    </script>
</body>
</html>
