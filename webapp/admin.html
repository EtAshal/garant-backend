<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель арбитража</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #1a1208; --bg2: #241a0e; --bg3: #2e2010;
            --border: #4a3520; --text: #e8d5b0; --text-dim: #a08060;
            --gold: #c9a84c; --gold-dim: #8b6914;
            --sealing: #7a3022; --sealing-lt: #9b4a35;
            --green: #4a7a50; --green-lt: #7acc84;
            --shadow: rgba(0,0,0,0.5);
        }
        body {
            font-family: 'Crimson Text', Georgia, serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 0 16px 40px;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(122,48,34,0.12) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        * { position: relative; z-index: 1; }

        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 24px 0 16px; border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .page-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); }
        .admin-badge {
            font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 1px;
            background: rgba(122,48,34,0.3); border: 1px solid var(--sealing);
            color: var(--sealing-lt); padding: 3px 8px; border-radius: 4px;
            margin-left: auto;
        }

        /* ── СТАТИСТИКА ── */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg2); border-radius: 8px; padding: 12px 10px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-icon { font-size: 20px; margin-bottom: 4px; }
        .stat-num {
            font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700;
            color: var(--gold);
        }
        .stat-label { font-size: 11px; font-style: italic; color: var(--text-dim); margin-top: 2px; }

        /* ── ВКЛАДКИ ── */
        .tabs {
            display: flex; gap: 6px; margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1; padding: 9px; border-radius: 6px;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-dim); font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            cursor: pointer; transition: all .2s;
        }
        .tab-btn.active { background: var(--bg2); color: var(--gold); border-color: var(--gold-dim); }

        /* ── КАРТОЧКА СПОРА ── */
        .dispute-card {
            background: var(--bg2); border-radius: 10px; padding: 16px;
            border: 1px solid var(--sealing); margin-bottom: 10px;
            box-shadow: 0 2px 12px var(--shadow);
        }
        .dispute-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--sealing); border-radius: 10px 0 0 10px;
        }
        .dispute-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px;
        }
        .dispute-desc {
            font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px;
        }
        .dispute-amount {
            font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700;
            color: var(--gold); flex-shrink: 0; margin-left: 10px;
        }
        .dispute-meta { font-size: 12px; font-style: italic; color: var(--text-dim); }

        .parties {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        .party-card {
            flex: 1; background: var(--bg3); border-radius: 6px;
            padding: 8px 10px; border: 1px solid var(--border);
        }
        .party-role {
            font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
            color: var(--text-dim); margin-bottom: 4px;
        }
        .party-id {
            font-family: 'Cinzel', serif; font-size: 12px; color: var(--text);
        }
        .party-action {
            font-size: 11px; margin-top: 3px; font-weight: 600;
        }
        .action-confirm { color: var(--green-lt); }
        .action-cancel  { color: var(--sealing-lt); }
        .action-none    { color: var(--text-dim); font-style: italic; }

        /* ── КНОПКИ РЕШЕНИЯ ── */
        .decision-btns {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            margin-top: 4px;
        }
        .btn-seller {
            padding: 11px; border-radius: 6px; border: none;
            background: rgba(74,122,80,0.2); color: var(--green-lt);
            border: 1px solid var(--green);
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all .15s; letter-spacing: 0.3px;
        }
        .btn-buyer {
            padding: 11px; border-radius: 6px; border: none;
            background: rgba(42,106,173,0.15); color: #5aabee;
            border: 1px solid #2a6aad;
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all .15s; letter-spacing: 0.3px;
        }
        .btn-seller:active { transform: scale(0.96); background: rgba(74,122,80,0.35); }
        .btn-buyer:active  { transform: scale(0.96); background: rgba(42,106,173,0.3); }

        /* ── ОБЫЧНЫЕ СДЕЛКИ ── */
        .deal-row {
            background: var(--bg2); border-radius: 8px; padding: 12px 14px;
            border: 1px solid var(--border); margin-bottom: 8px;
            display: flex; align-items: center; gap: 10px;
        }
        .deal-row-body { flex: 1; min-width: 0; }
        .deal-row-desc {
            font-size: 14px; font-weight: 600; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .deal-row-meta { font-size: 11px; font-style: italic; color: var(--text-dim); margin-top: 2px; }
        .deal-row-amount {
            font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
            color: var(--gold); flex-shrink: 0;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .dot-active   { background: var(--gold); }
        .dot-pending  { background: var(--text-dim); }
        .dot-dispute  { background: var(--sealing-lt); }
        .dot-completed { background: var(--green-lt); }

        /* ── САНКЦИИ ── */
        .sanctions {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(74,53,32,0.5);
        }
        .sanctions-title {
            font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--text-dim); margin-bottom: 8px;
        }
        .sanctions-btns {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .btn-sanction {
            padding: 7px 10px; border-radius: 5px; border: none;
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600;
            cursor: pointer; transition: all .15s; letter-spacing: 0.3px;
        }
        .btn-sanction:active { transform: scale(0.94); }
        .btn-penalty  { background: rgba(139,105,20,0.2); color: var(--gold-dim); border: 1px solid var(--gold-dim); }
        .btn-freeze   { background: rgba(42,106,173,0.15); color: #5aabee; border: 1px solid #2a6aad; }
        .btn-ban      { background: rgba(122,48,34,0.25); color: var(--sealing-lt); border: 1px solid var(--sealing); }

        .empty {
            text-align: center; padding: 40px 0;
            color: var(--text-dim); font-style: italic; font-size: 15px;
        }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }

        .section-title {
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--gold-dim); margin: 16px 0 10px;
        }

        /* ── ТОСТ ── */
        .toast {
            position: fixed; bottom: 80px; left: 50%; z-index: 999;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg2); border: 1px solid var(--green);
            border-radius: 10px; padding: 12px 20px;
            font-size: 14px; color: var(--green-lt);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            opacity: 0; pointer-events: none;
            transition: all .3s cubic-bezier(.34,1.56,.64,1);
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .fade-in { animation: fadeUp .4s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .skel {
            background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px;
        }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header fade-in">
    <span style="font-size:22px">⚖️</span>
    <span class="page-title">Арбитраж</span>
    <span class="admin-badge">АРБИТР</span>
</div>

<!-- Статистика -->
<div class="stats-grid fade-in" id="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">⚔️</div>
        <div class="stat-num" id="stat-disputes">—</div>
        <div class="stat-label">споров</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📜</div>
        <div class="stat-num" id="stat-active">—</div>
        <div class="stat-label">активных</div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">всего</div>
    </div>
</div>

<!-- Вкладки -->
<div class="tabs fade-in">
    <button class="tab-btn active" id="tab-disputes" onclick="switchTab('disputes')">⚔️ Споры</button>
    <button class="tab-btn" id="tab-all" onclick="switchTab('all')">📋 Все сделки</button>
</div>

<!-- Споры -->
<div id="panel-disputes"></div>

<!-- Все сделки -->
<div id="panel-all" style="display:none"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const BACKEND = 'https://garant-backend-production.up.railway.app';
const ADMIN_ID = 1291887879;
const currentUserId = tg.initDataUnsafe?.user?.id;

// Защита — только арбитр
if (currentUserId && currentUserId !== ADMIN_ID) {
    document.body.innerHTML = '<div style="text-align:center;padding:100px 20px;color:#a08060;font-style:italic;font-size:16px">⛔ Доступ запрещён</div>';
}

let toastTimer = null;
function showToast(msg, color = 'var(--green)') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.borderColor = color;
    el.style.color = color;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

let currentTab = 'disputes';
function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-disputes').classList.toggle('active', tab === 'disputes');
    document.getElementById('tab-all').classList.toggle('active', tab === 'all');
    document.getElementById('panel-disputes').style.display = tab === 'disputes' ? 'block' : 'none';
    document.getElementById('panel-all').style.display      = tab === 'all'      ? 'block' : 'none';
}

function fmt(amount) {
    const n = parseInt(amount);
    if (n >= 1000000) return (n/1000000).toFixed(1) + ' млн ₽';
    return n.toLocaleString('ru') + ' ₽';
}

function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Date.now() - new Date(dateStr);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(h / 24);
    if (d > 0) return d + ' дн. назад';
    if (h > 0) return h + ' ч. назад';
    return 'только что';
}

function actionLabel(action) {
    if (action === 'confirm') return `<span class="party-action action-confirm">✅ Подтвердил</span>`;
    if (action === 'cancel')  return `<span class="party-action action-cancel">❌ Отказался</span>`;
    return `<span class="party-action action-none">⏳ Ожидает</span>`;
}


        async function applyAction(userId, action) {
            const labels = { penalty: "штраф −300 очков", freeze: "заморозка на 7 дней", ban: "ВЕЧНАЯ БЛОКИРОВКА" };
            tg.showConfirm(`⚠️ Применить: ${labels[action]} для #${String(userId).slice(-6)}?`, async (confirmed) => {
                if (!confirmed) return;
                try {
                    const res = await fetch(`${BACKEND}/users/${userId}/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ admin_id: currentUserId, points: 300 }) });
                    const data = await res.json();
                    if (data.success) { const msgs = { penalty: "⚠️ Штраф выдан", freeze: "❄️ Заморожен на 7 дней", ban: "🚫 Заблокирован навсегда" }; showToast(msgs[action]); setTimeout(() => load(), 1000); }
                    else showToast("❌ " + data.error, "var(--sealing-lt)");
                } catch(e) { showToast("❌ Ошибка соединения", "var(--sealing-lt)"); }
            });
        }
async function resolveDispute(dealId, winner) {
    try {
        const res = await fetch(`${BACKEND}/deals/${dealId}/resolve`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ admin_id: currentUserId, winner })
        });
        const data = await res.json();
        if (data.success) {
            showToast(winner === 'seller' ? '✅ Решено в пользу продавца' : '✅ Решено в пользу покупателя');
            setTimeout(() => load(), 1000);
        } else {
            showToast('❌ Ошибка: ' + data.error, 'var(--sealing-lt)');
        }
    } catch(e) {
        showToast('❌ Ошибка соединения', 'var(--sealing-lt)');
    }
}

async function load() {
    try {
        const res  = await fetch(`${BACKEND}/feed`);
        const data = await res.json();
        if (!data.success) return;

        const all      = data.deals;
        const disputes = all.filter(d => d.status === 'dispute');
        const active   = all.filter(d => d.status === 'active' || d.status === 'pending');

        // Статистика
        document.getElementById('stat-disputes').textContent = disputes.length;
        document.getElementById('stat-active').textContent   = active.length;
        document.getElementById('stat-total').textContent    = all.length;

        // ── СПОРЫ ──
        const disputePanel = document.getElementById('panel-disputes');
        if (!disputes.length) {
            disputePanel.innerHTML = `<div class="empty"><div class="empty-icon">🕊️</div>Активных споров нет</div>`;
        } else {
            disputePanel.innerHTML = disputes.map(deal => `
                <div class="dispute-card fade-in">
                    <div class="dispute-header">
                        <div>
                            <div class="dispute-desc">${deal.description}</div>
                            <div class="dispute-meta">Открыт ${timeAgo(deal.updated_at || deal.created_at)}</div>
                        </div>
                        <div class="dispute-amount">${fmt(deal.amount)}</div>
                    </div>
                    <div class="parties">
                        <div class="party-card">
                            <div class="party-role">📦 Продавец</div>
                            <div class="party-id">#${String(deal.seller_id).slice(-6)}</div>
                            ${actionLabel(deal.seller_action)}
                            <a href="tg://user?id=${deal.seller_id}" style="display:block;margin-top:6px;text-align:center;padding:5px;background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);border-radius:4px;font-family:'Cinzel',serif;font-size:10px;color:var(--gold);text-decoration:none;letter-spacing:0.5px;">✉️ Написать</a>
                        </div>
                        <div class="party-card">
                            <div class="party-role">🛒 Покупатель</div>
                            <div class="party-id">${deal.buyer_id ? '#' + String(deal.buyer_id).slice(-6) : '—'}</div>
                            ${actionLabel(deal.buyer_action)}
                            ${deal.buyer_id ? `<a href="tg://user?id=${deal.buyer_id}" style="display:block;margin-top:6px;text-align:center;padding:5px;background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);border-radius:4px;font-family:'Cinzel',serif;font-size:10px;color:var(--gold);text-decoration:none;letter-spacing:0.5px;">✉️ Написать</a>` : ''}
                        </div>
                    </div>
                    <div class="decision-btns">
                        <button class="btn-seller" onclick="resolveDispute('${deal.id}', 'seller')">
                            ✅ Деньги продавцу
                        </button>
                        <button class="btn-buyer" onclick="resolveDispute('${deal.id}', 'buyer')">
                            🔄 Вернуть покупателю
                        </button>
                    </div>
                    <div class="sanctions">
                        <div class="sanctions-title">⚡ Санкции</div>
                        <div class="sanctions-btns">
                            <button class="btn-sanction btn-penalty" onclick="applyAction(${deal.seller_id}, 'penalty')">⚠️ −300 продавцу</button>
                            <button class="btn-sanction btn-freeze"  onclick="applyAction(${deal.seller_id}, 'freeze')">❄️ Заморозить продавца</button>
                            <button class="btn-sanction btn-ban"     onclick="applyAction(${deal.seller_id}, 'ban')">🚫 Бан продавца</button>
                        </div>
                        <div class="sanctions-btns" style="margin-top:5px">
                            ${deal.buyer_id ? `
                            <button class="btn-sanction btn-penalty" onclick="applyAction(${deal.buyer_id}, 'penalty')">⚠️ −300 покупателю</button>
                            <button class="btn-sanction btn-freeze"  onclick="applyAction(${deal.buyer_id}, 'freeze')">❄️ Заморозить покупателя</button>
                            <button class="btn-sanction btn-ban"     onclick="applyAction(${deal.buyer_id}, 'ban')">🚫 Бан покупателя</button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ── ВСЕ СДЕЛКИ ──
        const statusMap = {
            'pending':   ['🕯', 'dot-pending',   'Ожидает'],
            'active':    ['⚙️', 'dot-active',    'Активна'],
            'completed': ['✅', 'dot-completed', 'Завершена'],
            'cancelled': ['❌', 'dot-pending',   'Отменена'],
            'dispute':   ['⚔️', 'dot-dispute',   'Спор'],
        };
        document.getElementById('panel-all').innerHTML = all.map(deal => {
            const [icon, dotCls, label] = statusMap[deal.status] || ['❓','dot-pending','—'];
            return `
            <div class="deal-row fade-in">
                <div class="status-dot ${dotCls}"></div>
                <div class="deal-row-body">
                    <div class="deal-row-desc">${deal.description}</div>
                    <div class="deal-row-meta">${label} · ${timeAgo(deal.created_at)}</div>
                </div>
                <div class="deal-row-amount">${fmt(deal.amount)}</div>
            </div>`;
        }).join('');

    } catch(e) {
        console.error(e);
    }
}

load();
</script>
</body>
</html>
